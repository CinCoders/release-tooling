# This package's own pipeline.
#
# It deliberately does not consume ci-templates: those jobs build a container
# image and deploy it behind a webhook, and this is a library published to npm.
# What it shares with them is the convention, not the file.
#
# Its existence is also what keeps Auto DevOps away. With no .gitlab-ci.yml at
# all, GitLab falls back to Auto DevOps, which tries to build the package into a
# container image with buildpacks and fails on a registry it was never given.

stages:
  - test
  - publish

unit_test:
  stage: test
  image: node:24-alpine
  before_script:
    # The integration tests build real repositories and run the commands
    # against them.
    - apk add --no-cache git
    - git config --global user.email "ci@example.com"
    - git config --global user.name "ci"
  script:
    - npm ci
    - npm test

# Publishes on a tag. The rule requires NPM_TOKEN, so until the variable exists
# the job does not appear at all — better than a job that fails on every tag.
#
# Create it as a Masked and Protected CI variable holding an npm automation
# token with publish rights on the @cincoders scope.
publish:
  stage: publish
  image: node:24-alpine
  rules:
    - if: '$CI_COMMIT_TAG && $NPM_TOKEN'
  script:
    - npm ci
    - npm test
    # The tag is the source of truth for what gets published: publishing a
    # version the tag does not name is how a registry and a repository drift.
    - |
      VERSION=$(node -p "require('./package.json').version")
      if [ "v$VERSION" != "$CI_COMMIT_TAG" ]; then
        echo "❌ ERROR: tag $CI_COMMIT_TAG does not match package.json version $VERSION."
        exit 1
      fi
    - npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
    - npm publish
    - echo "✅ Published @cincoders/release-tooling@$VERSION"
